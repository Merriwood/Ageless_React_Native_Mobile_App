services:
  - type: web
    name: ageless-api
    env: node
    runtime: node
    buildCommand: npm install --production
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: fitness_tracker_db_ewht
      - key: JWT_SECRET
        sync: false
