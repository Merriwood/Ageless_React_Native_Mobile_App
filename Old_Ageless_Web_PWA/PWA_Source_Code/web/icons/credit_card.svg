<?xml version="1.0" encoding="utf-8"?>
<svg width="800px" height="800px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shading" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="black" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Main card outline -->
  <rect x="1" y="4" width="22" height="16" rx="1" ry="1" 
        fill="none" stroke="#000000" stroke-width="0.5"/>
  
  <!-- Top stripe/header section -->
  <line x1="1" y1="9" x2="23" y2="9" 
        stroke="#000000" stroke-width="0.5"/>
  
  <!-- Bottom section divider -->
  <line x1="1" y1="11" x2="23" y2="11" 
        stroke="#000000" stroke-width="0.5"/>
  
  <!-- Lighter shading between the lines -->
  <rect x="1" y="9" width="22" height="2" fill="url(#shading)"/>
</svg>
