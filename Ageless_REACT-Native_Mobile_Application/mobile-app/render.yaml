services:
  - type: web
    name: locali-corp
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # IMPORTANT: Set these secrets in Render Dashboard > Environment
      # Do NOT commit actual values to this file
      - key: DATABASE_URL
        sync: false  # Set manually in Render Dashboard
      - key: JWT_SECRET
        sync: false  # Set manually in Render Dashboard
      - key: CORS_ORIGIN
        value: https://locali-corp.onrender.com
