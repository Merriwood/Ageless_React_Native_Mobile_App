<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
  <title>Sterling Fitness</title>

  <!-- ============ Status Bar & Theme Colors (Web/PWA) ============ -->
  <!-- Chrome (Android) -->
  <meta name="theme-color" content="#0B0B0D" />
  <!-- Edge (Windows) -->
  <meta name="msapplication-TileColor" content="#0B0B0D" />
  <!-- Apple iOS/Safari -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Sterling Fitness" />

  <!-- ============ PWA Manifest ============ -->
  <link rel="manifest" href="./manifest.json" />

  <!-- ============ Icons & Favicons ============ -->
  <link rel="shortcut icon" href="./favicon.ico" />
  <link rel="apple-touch-icon" href="./assets/icon.png" />

  <!-- ============ Critical Styling (loads before JS) ============ -->
  <style>
    /* Reset browser defaults and set brand color */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      width: 100%;
      height: 100%;
      background-color: #0B0B0D; /* Obsidian - Sterling Fitness palette */
      /* Extend background behind Dynamic Island / notch on iOS */
      min-height: 100vh;
      min-height: -webkit-fill-available;
    }

    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #0B0B0D; /* Ensures no flash on load */
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      min-height: 100vh;
      min-height: -webkit-fill-available;
    }

    /* React root container */
    #root {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      background-color: #0B0B0D;
      overflow: hidden;
      /* Pad content away from safe areas but let background fill behind them */
      padding-top: env(safe-area-inset-top, 0);
      padding-bottom: env(safe-area-inset-bottom, 0);
      padding-left: env(safe-area-inset-left, 0);
      padding-right: env(safe-area-inset-right, 0);
    }

    /* Prevent layout shift during app load */
    body.loading {
      overflow: hidden;
    }

    body.loading #root {
      visibility: hidden;
      opacity: 0;
    }

    /* Fade in when app ready */
    body:not(.loading) #root {
      animation: fadeIn 200ms ease-in-out forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    /* Prevent text selection on interactive elements */
    button, input, textarea, select {
      -webkit-user-select: text;
      user-select: text;
    }
  </style>
</head>
<body class="loading">
  <div id="root"></div>

  <script>
    /**
     * Status Bar Color Enhancement for Web/PWA
     * Ensures brand color is set in browser UI and status bar
     */
    function setStatusBarColor() {
      const brandColor = '#0B0B0D';

      // Try to set via meta tag (Chrome on Android)
      let themeColorMeta = document.querySelector('meta[name="theme-color"]');
      if (!themeColorMeta) {
        themeColorMeta = document.createElement('meta');
        themeColorMeta.name = 'theme-color';
        document.head.appendChild(themeColorMeta);
      }
      themeColorMeta.content = brandColor;

      // Ensure body/html background is set
      document.documentElement.style.backgroundColor = brandColor;
      document.body.style.backgroundColor = brandColor;
    }

    // Set color immediately on script load
    setStatusBarColor();

    // Remove loading overlay once app initializes
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        document.body.classList.remove('loading');
      }, 100);
    });

    // Re-apply color on app resume (especially for PWA)
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible') {
        setStatusBarColor();
      }
    });
  </script>
</body>
</html>
