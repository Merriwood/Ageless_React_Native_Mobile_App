# Test: Profile/MyBody Screen Flow
# Duration: ~2 minutes
# Critical Path: MEDIUM
# Purpose: Verify user profile and MyBody screen functionality

---
appId: exp.ageless
---

# Setup: Login to Dashboard
- tapOn:
    id: "signin-button"
- inputText: "test@ageless.app"
  at:
    id: "email-input"
- inputText: "Test@123"
  at:
    id: "password-input"
- tapOn:
    id: "signin-button"
- waitForText:
    text: "Login successful"
    timeout: 5

# Test 1: Profile Tab in Bottom Nav
- assertVisible:
    id: "profile-tab"
- assertVisible:
    text: "🎁"

# Test 2: Navigate to Profile
- tapOn:
    text: "🎁"
- waitForText:
    text: "My Body"
    timeout: 3

# Test 3: MyBody Screen Loads
- assertVisible:
    id: "profile-screen"
- assertVisible:
    text: "My Body"

# Test 4: User Info Displays
- assertVisible:
    id: "user-name-display"
- assertVisible:
    id: "user-email-display"

# Test 5: Body Measurements Section
- assertVisible:
    id: "body-measurements"
- assertVisible:
    text: "Height"
- assertVisible:
    text: "Weight"

# Test 6: Settings/Preferences
- assertVisible:
    id: "profile-settings"
- scroll:
    direction: DOWN
    iterations: 2

# Test 7: Logout Button
- assertVisible:
    id: "logout-button"
- assertVisible:
    text: "Logout"

# Test 8: Navigate Away and Back
- tapOn:
    text: "🏠"
- waitForText:
    text: "Dashboard"
    timeout: 2

# Test 9: Return to Profile
- tapOn:
    text: "🎁"
- waitForText:
    text: "My Body"
    timeout: 2

# Test 10: Profile Persistence
- assertVisible:
    id: "user-name-display"
- assertVisible:
    id: "body-measurements"

