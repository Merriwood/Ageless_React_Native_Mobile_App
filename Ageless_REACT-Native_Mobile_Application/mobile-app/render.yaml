services:
  - type: web
    name: ageless-mobile-web
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npx serve -s dist -p 8081 --single
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=512
    disk:
      name: data
      mountPath: /data
      sizeGB: 10
