services:
  - type: web
    name: ageless-api
    env: node
    runtime: node
    buildCommand: npm install --production
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NPM_CONFIG_IGNORE_SCRIPTS
        value: 'true'
