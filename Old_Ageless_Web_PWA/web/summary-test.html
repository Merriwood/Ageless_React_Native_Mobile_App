<!DOCTYPE html>
<html>
<head>
    <title>Summary API Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .result { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 4px; }
        .error { background: #ffe6e6; color: #d63384; }
        .success { background: #e6ffe6; color: #198754; }
    </style>
</head>
<body>
    <h1>Summary API Test</h1>
    <button onclick="testSummaryAPI()">Test Summary API</button>
    <div id="results"></div>

    <script>
        async function testSummaryAPI() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="result">Testing...</div>';
            
            try {
                // Test the summary endpoint
                const response = await fetch('/api/summary', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        // Note: This will fail without auth, but we can see the error
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultsDiv.innerHTML = `
                        <div class="result success">
                            <h3>✅ Success</h3>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="result error">
                            <h3>❌ API Error</h3>
                            <p>Status: ${response.status}</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ Network Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
        
        // Test the frontend function
        function testFrontendFunction() {
            // Mock API response
            const mockWeeks = [
                {
                    week_of_sunday: '2025-08-11',
                    weight_avg: 175.5,
                    totals: {
                        'Bike': 4,
                        'Abs': 8,
                        'Chest Press': 6
                    }
                }
            ];
            
            console.log('Testing frontend with mock data:', mockWeeks);
            
            // Test the logic
            mockWeeks.forEach(row => {
                const totals = row.totals || {};
                const totalSets = Object.values(totals).reduce((a,b) => a + parseInt(b||0), 0);
                console.log('Total sets calculated:', totalSets);
            });
        }
        
        // Run frontend test on load
        testFrontendFunction();
    </script>
</body>
</html>
